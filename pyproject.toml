[project]
name = "qforge"
version = "1.0.0"
description = "QForge — Hybrid Multi-Agent RAG Platform for Enterprise Software Validation"
requires-python = ">=3.13"

[project.dependencies]
# FastAPI + server
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.32.0"}
websockets = ">=13.0"
python-multipart = ">=0.0.12"

# LangGraph + LangChain
langgraph = ">=0.2.0"
langchain = ">=0.3.0"
langchain-community = ">=0.3.0"
langchain-google-genai = ">=2.0.0"

# Ollama
ollama = ">=0.3.0"

# Google Gemini
google-generativeai = ">=0.8.0"

# Vector store + Embeddings
faiss-cpu = ">=1.8.0"
sentence-transformers = ">=3.0.0"

# MongoDB
motor = ">=3.5.0"
pymongo = ">=4.9.0"

# Configuration
pydantic = ">=2.9.0"
pydantic-settings = ">=2.5.0"
python-dotenv = ">=1.0.0"

# AST / SQL Parsing
sqlglot = ">=25.0.0"

# Utilities
structlog = ">=24.0.0"
httpx = ">=0.27.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
